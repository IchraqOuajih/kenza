services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kenza
      POSTGRES_PASSWORD: kenza
      POSTGRES_DB: kenza
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenza"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://kenza:kenza@postgres:5432/kenza
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    volumes:
      - ./api/src:/app/api/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "./api/node_modules/.bin/tsx api/src/db/migrate.ts &&
             ./api/node_modules/.bin/tsx api/src/db/load-csv.ts &&
             ./api/node_modules/.bin/tsx api/src/server.ts"

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://kenza:kenza@postgres:5432/kenza
      REDIS_URL: redis://redis:6379
    volumes:
      - ./api/src:/app/api/src
      - ./data:/app/data
    depends_on:
      api:
        condition: service_started
    command: ["./api/node_modules/.bin/tsx", "api/src/worker.ts"]

  web:
    build:
      context: ./web
    ports: ["5173:5173"]
    volumes:
      - ./web/src:/app/src
    depends_on:
      - api